<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketPlace Manager Pro</title>
    
    <!-- Scripts for React, Babel and Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Assistant', sans-serif;
            transition: background-color 0.5s ease;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, Fragment } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxIiG7pBw9NkMA2rxMCWeK-tF-liXvbCxSfF0CQJ7c8N4M7Pu1fvEdZJAQ4E5OHqaOM3w/exec";

        // --- Helper Functions ---
        
        const blendWithWhite = (hex, alpha) => {
            if (!hex) return '#ffffff';
            let r = 0, g = 0, b = 0;
            if (hex.length === 4) {
                r = parseInt(hex[1] + hex[1], 16);
                g = parseInt(hex[2] + hex[2], 16);
                b = parseInt(hex[3] + hex[3], 16);
            } else if (hex.length === 7) {
                r = parseInt(hex.substring(1, 3), 16);
                g = parseInt(hex.substring(3, 5), 16);
                b = parseInt(hex.substring(5, 7), 16);
            }
            const blend = (c) => Math.floor(c * alpha + 255 * (1 - alpha));
            return `rgb(${blend(r)}, ${blend(g)}, ${blend(b)})`;
        };

        const hexToRgba = (hex, opacity) => {
            if (!hex) return `rgba(0,0,0,${opacity})`;
            let r = 0, g = 0, b = 0;
            if (hex.length === 4) {
                r = parseInt(hex[1] + hex[1], 16);
                g = parseInt(hex[2] + hex[2], 16);
                b = parseInt(hex[3] + hex[3], 16);
            } else if (hex.length === 7) {
                r = parseInt(hex.substring(1, 3), 16);
                g = parseInt(hex.substring(3, 5), 16);
                b = parseInt(hex.substring(5, 7), 16);
            }
            return `rgba(${r}, ${g}, ${b}, ${opacity})`;
        };

        const normalizeDate = (d) => {
            if (!d) return "";
            let s = String(d).trim();
            if (s.includes('T') || (s.includes('-') && s.length > 8) || s.includes('/')) {
                const dateObj = new Date(s);
                if (!isNaN(dateObj.getTime())) {
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const year = dateObj.getFullYear();
                    if (year < 1910) return ""; 
                    return `${day}/${month}/${year}`;
                }
            }
            return s;
        };

        const normalizeTime = (t) => {
            if (!t) return "";
            let s = String(t).trim();
            if (s.includes('T') || (s.includes('-') && s.length > 10)) {
                const d = new Date(s);
                if (!isNaN(d.getTime())) {
                    const rounded = new Date(d.getTime() + 30000); 
                    const h = String(rounded.getHours()).padStart(2, '0');
                    const m = String(rounded.getMinutes()).padStart(2, '0');
                    return `${h}:${m}`;
                }
            }
            const parts = s.split(':');
            if (parts.length >= 2) {
                const h = parts[0].padStart(2, '0');
                const m = parts[1].padEnd(2, '0').slice(0, 2);
                return `${h}:${m}`;
            }
            return s;
        };

        const formatDuration = (mins) => {
            const m = parseInt(mins);
            if (isNaN(m)) return mins;
            if (m === 15) return "15 דקות";
            if (m === 30) return "חצי שעה";
            if (m === 45) return "45 דקות";
            if (m === 60) return "שעה";
            if (m === 90) return "שעה וחצי";
            if (m === 120) return "שעתיים";
            if (m > 120) {
                const h = Math.floor(m / 60);
                const left = m % 60;
                return left === 0 ? `${h} שעות` : `${h} שעות ו-${left} דק'`;
            }
            return `${m} דק'`;
        };

        const generateTimeSlots = (open, close, interval) => {
            const start = normalizeTime(open);
            const end = normalizeTime(close);
            const gap = parseInt(interval) || 30;
            if (!start || !end) return [];
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            let currentMins = sH * 60 + sM;
            const endMins = eH * 60 + eM;
            const slots = [];
            while (currentMins + gap <= endMins) {
                const h = Math.floor(currentMins / 60);
                const m = currentMins % 60;
                slots.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
                currentMins += gap;
            }
            return slots;
        };

        // --- UI Components ---

        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                calendar: <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>,
                clock: <Fragment><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Fragment>,
                user: <Fragment><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Fragment>,
                settings: <Fragment><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2 2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Fragment>,
                logout: <Fragment><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Fragment>,
                plus: <Fragment><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Fragment>,
                trash: <Fragment><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Fragment>,
                image: <Fragment><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></Fragment>,
                moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
                sun: <Fragment><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></Fragment>,
                refresh: <Fragment><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></Fragment>,
                x: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>,
                lock: <Fragment><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Fragment>,
                mail: <Fragment><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></Fragment>,
                check: <polyline points="20 6 9 17 4 12"/>,
                alert: <Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Fragment>,
                phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.79 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-4.5 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 .81 2.82A2 2 0 0 1 22 16.92z"/>,
                users: <Fragment><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Fragment>
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || icons.calendar}
                </svg>
            );
        };

        const Card = ({ children, className = "", themeColor, isDarkMode, ...props }) => (
            <div 
                className={`rounded-2xl shadow-sm border border-slate-200/40 p-6 transition-all ${className}`} 
                style={{ 
                    backgroundColor: isDarkMode ? 'rgb(30, 41, 59)' : blendWithWhite(themeColor, 0.08), 
                    ...props.style 
                }}
                {...props}
            >
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = "primary", className = "", disabled = false, themeColor = "#2563eb", type = "button" }) => {
            const variantClasses = {
                primary: "text-white hover:opacity-90 shadow-md",
                secondary: "bg-black/5 text-slate-700 hover:bg-black/10 dark:bg-slate-700 dark:text-slate-100",
                danger: "bg-red-500 text-white hover:bg-red-600 shadow-sm",
                outline: "border border-slate-300 text-slate-700 hover:bg-white/50 dark:border-slate-600 dark:text-slate-200"
            };
            const style = variant === 'primary' ? { backgroundColor: themeColor } : {};
            return (
                <button type={type} disabled={disabled} onClick={onClick} style={style} className={`px-5 py-3 rounded-xl font-bold transition-all active:scale-95 disabled:opacity-50 flex items-center justify-center gap-2 ${variantClasses[variant]} ${className}`}>
                    {children}
                </button>
            );
        };

        const NavTab = ({ active, label, icon, onClick, themeColor, isDarkMode }) => {
            return (
                <button 
                    onClick={onClick} 
                    className={`py-4 px-8 border-b-4 font-black whitespace-nowrap transition-all flex items-center gap-3 text-sm uppercase tracking-tighter ${active ? 'text-slate-900 dark:text-white' : 'border-transparent text-slate-400 hover:text-slate-500'}`} 
                    style={active ? {borderColor: themeColor, backgroundColor: isDarkMode ? hexToRgba(themeColor, 0.2) : blendWithWhite(themeColor, 0.12)} : {}}
                >
                    <Icon name={icon} size={18}/> {label}
                </button>
            );
        };

        // --- Sub-View Components ---

        function LoginScreen({ onLogin, themeColor, isDarkMode, setIsDarkMode, status, refreshing, callApi }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [showRegister, setShowRegister] = useState(false);
            
            const [regName, setRegName] = useState('');
            const [regEmail, setRegEmail] = useState('');
            const [regPhone, setRegPhone] = useState('');
            const [regPass, setRegPass] = useState('');
            const [regPassConfirm, setRegPassConfirm] = useState('');
            const [regError, setRegError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!onLogin(email, password)) {
                    setError('אימייל או סיסמה לא נכונים');
                }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                if (regPass !== regPassConfirm) {
                    setRegError('הסיסמאות אינן תואמות');
                    return;
                }
                const newUser = {
                    id: String(Date.now()),
                    type: 'user',
                    email: regEmail.toLowerCase().trim(),
                    password: regPass,
                    role: 'customer',
                    name: regName,
                    phone: regPhone
                };
                callApi({ action: 'ADD_ROW', data: newUser });
                setShowRegister(false);
                setRegError('');
                setError('חשבון נוצר בהצלחה. כעת ניתן להתחבר.');
                setRegName(''); setRegEmail(''); setRegPhone(''); setRegPass(''); setRegPassConfirm('');
            };

            return (
                <div className={`min-h-screen flex items-center justify-center p-6 transition-colors ${isDarkMode ? 'dark bg-slate-900' : ''}`} dir="rtl" style={!isDarkMode ? {backgroundColor: blendWithWhite(themeColor, 0.05)} : {}}>
                    <Card themeColor={themeColor} isDarkMode={isDarkMode} className="max-w-md w-full p-10 relative overflow-hidden shadow-2xl border-t-[10px]" style={{borderTopColor: themeColor, backgroundColor: isDarkMode ? '' : blendWithWhite(themeColor, 0.15) }}>
                        <div className="flex justify-between items-center mb-10">
                            <div className="flex flex-col">
                                <h1 className="text-4xl font-black dark:text-white tracking-tighter">כניסה</h1>
                                <div className="flex items-center gap-2 mt-2">
                                    <div className={`w-2.5 h-2.5 rounded-full ${status === 'מחובר' ? 'bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.5)]' : 'bg-red-500 animate-pulse'}`}></div>
                                    <span className="text-[11px] uppercase font-black text-slate-400 tracking-wider flex items-center gap-1">
                                        {status}
                                        {refreshing && <Icon name="refresh" size={10} className="animate-spin text-blue-500"/>}
                                    </span>
                                </div>
                            </div>
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-3 text-slate-400 rounded-2xl bg-white/50 dark:bg-slate-700 shadow-inner">
                                <Icon name={isDarkMode ? "sun" : "moon"} size={22}/>
                            </button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div className="space-y-2 text-right">
                                <label className="text-xs font-black text-slate-500 dark:text-slate-400 flex items-center gap-2 uppercase tracking-wide"><Icon name="mail" size={14}/> כתובת אימייל</label>
                                <input type="email" required className="w-full border rounded-2xl p-4 dark:bg-slate-700 dark:text-white outline-none focus:ring-4 transition-all border-slate-200 dark:border-slate-600 bg-white/70 shadow-inner" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@example.com" />
                            </div>
                            <div className="space-y-2 text-right">
                                <label className="text-xs font-black text-slate-500 dark:text-slate-400 flex items-center gap-2 uppercase tracking-wide"><Icon name="lock" size={14}/> סיסמה</label>
                                <input type="password" required className="w-full border rounded-2xl p-4 dark:bg-slate-700 dark:text-white outline-none focus:ring-4 transition-all border-slate-200 dark:border-slate-600 bg-white/70 shadow-inner" style={{'--tw-ring-color': themeColor + '33'}} value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" />
                            </div>
                            {error && <p className="text-red-500 text-sm font-bold animate-shake bg-red-50 dark:bg-red-900/20 p-3 rounded-xl text-center border border-red-100 dark:border-red-800">{error}</p>}
                            <Button type="submit" className="w-full py-4 text-xl shadow-xl" themeColor={themeColor}>התחבר עכשיו</Button>
                        </form>
                        <div className="mt-8 pt-6 border-t dark:border-slate-700 text-center">
                            <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">אין לך חשבון?</p>
                            <Button variant="outline" className="w-full" onClick={() => setShowRegister(true)}>הרשמה למשתמש חדש</Button>
                        </div>
                    </Card>
                    {showRegister && (
                        <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4 backdrop-blur-xl">
                            <Card themeColor={themeColor} isDarkMode={isDarkMode} className="max-w-lg w-full animate-in slide-in-from-bottom-12 duration-500 shadow-[0_0_80px_rgba(0,0,0,0.6)] rounded-[2.5rem] overflow-hidden p-0 border-none" style={{backgroundColor: isDarkMode ? '' : blendWithWhite(themeColor, 0.15) }}>
                                <div className="p-8 bg-black/5 dark:bg-slate-700 flex justify-between items-center border-b dark:border-slate-600 shadow-sm">
                                    <div className="flex flex-col">
                                        <h3 className="font-black text-3xl dark:text-white tracking-tighter">הרשמת לקוח חדש</h3>
                                        <p className="text-[10px] font-black uppercase text-slate-400 mt-2 tracking-widest">Create New Account</p>
                                    </div>
                                    <button onClick={()=>setShowRegister(false)} className="p-3 hover:bg-white/50 dark:hover:bg-slate-600 rounded-2xl transition-colors bg-white/20 shadow-sm border dark:border-slate-600"><Icon name="x" size={24}/></button>
                                </div>
                                <form onSubmit={handleRegister} className="p-8 space-y-6 text-right">
                                    {regError && <p className="text-red-500 text-sm font-bold animate-shake bg-red-50 dark:bg-red-900/20 p-3 rounded-xl text-center border border-red-100 dark:border-red-800">{regError}</p>}
                                    
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">שם מלא</label>
                                        <input required className="w-full border-2 rounded-2xl p-4 dark:bg-slate-800 dark:text-white outline-none focus:ring-4 transition-all bg-white/70 border-slate-100 shadow-inner" value={regName} onChange={e=>setRegName(e.target.value)} placeholder="ישראל ישראלי" />
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">אימייל</label>
                                            <input type="email" required className="w-full border-2 rounded-2xl p-4 dark:bg-slate-800 dark:text-white outline-none focus:ring-4 transition-all bg-white/70 border-slate-100 shadow-inner" value={regEmail} onChange={e=>setRegEmail(e.target.value)} placeholder="name@example.com" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">מספר טלפון</label>
                                            <input type="tel" required className="w-full border-2 rounded-2xl p-4 dark:bg-slate-800 dark:text-white outline-none focus:ring-4 transition-all bg-white/70 border-slate-100 shadow-inner" value={regPhone} onChange={e=>setRegPhone(e.target.value)} placeholder="050-0000000" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">בחר סיסמה</label>
                                            <input type="password" required className="w-full border-2 rounded-2xl p-4 dark:bg-slate-800 dark:text-white outline-none focus:ring-4 transition-all bg-white/70 border-slate-100 shadow-inner" value={regPass} onChange={e=>setRegPass(e.target.value)} placeholder="••••••••" />
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">אימות סיסמה</label>
                                            <input type="password" required className="w-full border-2 rounded-2xl p-4 dark:bg-slate-800 dark:text-white outline-none focus:ring-4 transition-all bg-white/70 border-slate-100 shadow-inner" value={regPassConfirm} onChange={e=>setRegPassConfirm(e.target.value)} placeholder="••••••••" />
                                        </div>
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <Button variant="secondary" className="flex-1 py-5 text-xl" onClick={()=>setShowRegister(false)}>ביטול</Button>
                                        <Button type="submit" themeColor={themeColor} className="flex-1 py-5 font-black shadow-2xl text-xl">צור חשבון</Button>
                                    </div>
                                </form>
                            </Card>
                        </div>
                    )}
                </div>
            );
        }

        function SellerView({ tab, dbData, callApi, themeColor, setThemeColor, isSaving, setActiveTab, isDarkMode }) {
            const appointments = useMemo(() => (dbData || []).filter(i => i.type === 'appointment'), [dbData]);
            const services = useMemo(() => (dbData || []).filter(i => i.type === 'service'), [dbData]);
            const customers = useMemo(() => (dbData || []).filter(i => i.type === 'user' && i.role === 'customer'), [dbData]);
            const [editing, setEditing] = useState(null);
            const [customerModal, setCustomerModal] = useState(null);

            if (tab === 'main') return (
                <div className="space-y-8 animate-in fade-in duration-500 text-right">

                        {appointments.map((a, idx) => {

                            const hasConflict = appointments.filter(other => other && String(other.id) !== String(a.id) && other.date === a.date && normalizeTime(other.time) === normalizeTime(a.time)).length > 0;
                            const isCancelRequested = a.status === 'cancel_requested';

                            const customerPhone = customerRecord?.phone || "אין טלפון";

                                <Card key={a.id || idx} themeColor={themeColor} isDarkMode={isDarkMode} className="border-r-[6px] hover:shadow-xl transition-all group border-slate-100 dark:border-slate-700" style={{borderRightColor: isCancelRequested ? '#ef4444' : a.status === 'confirmed' ? themeColor : '#f59e0b'}}>

                                        <div className="text-left bg-black/5 dark:bg-slate-900/50 p-2 rounded-xl border dark:border-slate-700">

                                            <p className="text-2xl font-black mt-1" style={{color: themeColor}}>{normalizeTime(a.time)}</p>

                                    <div className="bg-white/40 dark:bg-slate-900/50 p-4 rounded-2xl mb-6 border border-slate-100 dark:border-slate-700 shadow-inner">
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-2 flex items-center gap-1.5"><Icon name="mail" size={12}/> הודעת לקוח</p>
                                        <p className="text-sm dark:text-slate-200 italic font-medium leading-relaxed">"{a.message || 'לא נכתבה הודעה'}"</p>
                                    </div>
                                    <div className="space-y-3">
                                        {isCancelRequested ? (
                                            <div className="space-y-2">
                                                <Button variant="danger" className="w-full" disabled={isSaving} onClick={() => callApi({action: 'DELETE_ROW', id: a.id})}><Icon name="trash" size={16}/> אשר ביטול ומחק תור</Button>
                                                <Button variant="secondary" className="w-full" disabled={isSaving} onClick={() => callApi({action: 'UPDATE_ROW', id: a.id, updates: {status: 'confirmed'}})}><Icon name="x" size={16}/> סרב לביטול (השאר תור)</Button>
                                            </div>
                                        ) : a.status !== 'confirmed' && (
                                            <Button themeColor="#f59e0b" className="w-full" disabled={isSaving} onClick={() => callApi({action: 'UPDATE_ROW', id: a.id, updates: {status: 'confirmed'}})}><Icon name="check" size={16}/> אשר הזמנה</Button>
                                        )}

                    {editing && (

                                <div className="p-8 bg-black/5 dark:bg-slate-700 flex justify-between items-center border-b dark:border-slate-600 shadow-sm">

                                    <button onClick={()=>setEditing(null)} className="p-3 text-slate-400 hover:text-slate-600 transition-colors bg-white shadow-sm rounded-2xl"><Icon name="x"/></button>
                                </div>
                                <form className="p-8 space-y-6 pt-2 text-right" onSubmit={(e) => {
                                    e.preventDefault();
                                    const formData = new FormData(e.target);
                                    callApi({
                                        action: 'UPDATE_ROW',
                                        id: editing.id,
                                        updates: {
                                            customerName: formData.get('name'),
                                            message: formData.get('msg'),
                                            date: formData.get('date'),
                                            time: formData.get('time')
                                        }

                                    </div>

                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">תאריך</label>

                                        </div>
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">הודעה</label>
                                        <textarea name="msg" className="w-full border-2 rounded-2xl p-4 dark:bg-slate-800 dark:text-white outline-none bg-white/70 border-slate-100 shadow-inner min-h-[120px]" defaultValue={editing.message} />
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <Button variant="danger" className="flex-1 py-4 text-lg" disabled={isSaving} onClick={() => { callApi({action:'DELETE_ROW', id:editing.id}); setEditing(null); }}><Icon name="trash" size={18}/> ביטול תור</Button>
                                        <Button themeColor={themeColor} disabled={isSaving} type="submit" className="flex-1 py-4 font-black shadow-xl text-lg">{isSaving ? "מעדכן..." : "שמור שינויים"}</Button>
                                    </div>
                                </form>
                            </Card>
                        </div>
                    )}
                </div>
            );

            if (tab === 'customers') return (
                <div className="space-y-8 animate-in fade-in duration-500 text-right">
                    <div className="flex justify-between items-center">
                        <h2 className="text-3xl font-black dark:text-white tracking-tighter leading-none">ניהול לקוחות המרקט</h2>
                        <Button themeColor={themeColor} onClick={() => setCustomerModal({mode: 'add', customer: {}})}><Icon name="plus" size={18}/> הוסף לקוח ידנית</Button>
                    </div>
                    <div className="grid gap-4">
                        {customers.map((c, idx) => (
                            <Card key={c.id || idx} themeColor={themeColor} isDarkMode={isDarkMode} className="flex items-center justify-between p-6">

                                    <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-sm" style={{backgroundColor: themeColor}}><Icon name="user" size={24}/></div>
                                    <div className="text-right"><h4 className="font-bold text-xl dark:text-white leading-none">{c.name || "ללא שם"}</h4><div className="flex gap-4 mt-2"><p className="text-sm font-bold text-slate-500 flex items-center gap-1"><Icon name="phone" size={12}/> {c.phone || "ללא טלפון"}</p><p className="text-sm font-bold text-slate-500 flex items-center gap-1"><Icon name="mail" size={12}/> {c.email || "ללא אימייל"}</p></div></div>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setCustomerModal({mode: 'edit', customer: c})} className="p-3 text-slate-400 bg-black/5 rounded-xl"><Icon name="settings" size={18}/></button>
                                    <button onClick={() => callApi({action:'DELETE_ROW', id: c.id})} className="p-3 text-red-400 bg-red-50 rounded-xl"><Icon name="trash" size={18}/></button>
                                </div>
                            </Card>
                        ))}
                    </div>
                    {customerModal && (
                        <div className="fixed inset-0 bg-slate-900/20 z-[100] flex items-center justify-center p-4 backdrop-blur-md">
                            <Card themeColor={themeColor} isDarkMode={isDarkMode} className="max-w-md w-full space-y-8 shadow-2xl p-0 border-none rounded-[2rem]" style={{backgroundColor: isDarkMode ? '' : blendWithWhite(themeColor, 0.15) }}>
                                <div className="p-8 bg-black/5 dark:bg-slate-700 flex justify-between items-center border-b dark:border-slate-600 shadow-sm">
                                    <h3 className="font-black text-2xl dark:text-white tracking-tighter">{customerModal.mode === 'add' ? 'הוספת לקוח חדש' : 'עריכת פרטי לקוח'}</h3>
                                    <button onClick={()=>setCustomerModal(null)} className="p-3 text-slate-400 bg-white shadow-sm rounded-2xl"><Icon name="x"/></button>
                                </div>
                                <form className="p-8 space-y-5 text-right" onSubmit={(e) => {
                                    e.preventDefault();
                                    const updates = { name: e.target.cName.value, email: e.target.cEmail.value, phone: e.target.cPhone.value, password: e.target.cPass.value, type: 'user', role: 'customer' };
                                    if (customerModal.mode === 'add') { callApi({action: 'ADD_ROW', data: {id: String(Date.now()), ...updates}}); } 
                                    else { callApi({action: 'UPDATE_ROW', id: customerModal.customer.id, updates}); }
                                    setCustomerModal(null);
                                }}>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest mb-1">שם מלא</label><input name="cName" required defaultValue={customerModal.customer.name} className="w-full border-2 rounded-xl p-3 bg-white/70 outline-none" /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest mb-1">אימייל</label><input name="cEmail" type="email" required defaultValue={customerModal.customer.email} className="w-full border-2 rounded-xl p-3 bg-white/70 outline-none" /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest mb-1">טלפון</label><input name="cPhone" required defaultValue={customerModal.customer.phone} className="w-full border-2 rounded-xl p-3 bg-white/70 outline-none" /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest mb-1">סיסמה</label><input name="cPass" required defaultValue={customerModal.customer.password} className="w-full border-2 rounded-xl p-3 bg-white/70 outline-none" /></div>
                                    <Button type="submit" themeColor={themeColor} className="w-full py-4 mt-4 font-black">{customerModal.mode === 'add' ? 'צור לקוח' : 'שמור שינויים'}</Button>
                                </form>
                            </Card>
                        </div>
                    )}
                </div>
            );

            if (tab === 'services') return (
                <div className="space-y-8 animate-in fade-in duration-500 text-right">
                    <div className="flex justify-between items-center">
                        <h2 className="text-3xl font-black dark:text-white tracking-tighter leading-none">ניהול שירותים ומכירה</h2>
                        <Button themeColor={themeColor} onClick={() => callApi({action: 'ADD_ROW', data: {id: String(Date.now()), type: 'service', name: 'שירות חדש', open: '09:00', close: '18:00', interval: '30', img: ''}})}><Icon name="plus" size={18}/> הוסף שירות</Button>
                    </div>
                    <div className="grid gap-6">
                        {services.map((s, idx) => (
                            <Card key={s.id || idx} themeColor={themeColor} isDarkMode={isDarkMode} className="flex flex-col md:flex-row gap-8 items-center p-8 hover:border-slate-400 group relative overflow-hidden text-right">
                                <div className="absolute top-0 right-0 w-1.5 h-full" style={{backgroundColor: themeColor}}></div>
                                <div className="w-24 h-24 bg-white/50 dark:bg-slate-900 rounded-3xl flex items-center justify-center text-slate-400 shrink-0 shadow-inner border-2 border-dashed border-slate-300 transition-transform group-hover:scale-105">{s.img ? <img src={s.img} className="w-full h-full object-cover rounded-3xl"/> : <Icon name="image" size={32}/>}</div>
                                <div className="flex-1 grid grid-cols-2 md:grid-cols-5 gap-6 w-full">
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">שם השירות</label><input className="w-full border-2 rounded-xl p-3 text-sm bg-white/70 outline-none" defaultValue={s.name} onBlur={e=>callApi({action:'UPDATE_ROW', id:s.id, updates:{name:e.target.value}})} /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">URL לתמונה</label><input className="w-full border-2 rounded-xl p-3 text-sm bg-white/70 outline-none" defaultValue={s.img} onBlur={e=>callApi({action:'UPDATE_ROW', id:s.id, updates:{img:e.target.value}})} placeholder="https://..." /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">פתיחה</label><input type="time" className="w-full border-2 rounded-xl p-3 text-sm bg-white/70" defaultValue={normalizeTime(s.open)} onBlur={e=>callApi({action:'UPDATE_ROW', id:s.id, updates:{open:e.target.value}})} /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">סגירה</label><input type="time" className="w-full border-2 rounded-xl p-3 text-sm bg-white/70" defaultValue={normalizeTime(s.close)} onBlur={e=>callApi({action:'UPDATE_ROW', id:s.id, updates:{close:e.target.value}})} /></div>
                                    <div><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">מרווח</label><select className="w-full border-2 rounded-xl p-3 text-sm bg-white/70" defaultValue={s.interval} onChange={e=>callApi({action:'UPDATE_ROW', id:s.id, updates:{interval:e.target.value}})}><option value="15">15 דק'</option><option value="30">30 דק'</option><option value="45">45 דק'</option><option value="60">שעה</option><option value="120">שעתיים</option><option value="240">4 שעות</option><option value="480">8 שעות</option><option value="720">12 שעות</option></select></div>
                                </div>
                                <Button variant="danger" className="p-3.5 rounded-2xl shrink-0" onClick={()=>callApi({action:'DELETE_ROW', id:s.id})}><Icon name="trash" size={20}/></Button>
                            </Card>
                        ))}
                    </div>
                </div>
            );

            if (tab === 'settings') return (
                <div className="max-w-2xl mx-auto py-12 animate-in slide-in-from-bottom-8 duration-700">
                    <Card themeColor={themeColor} isDarkMode={isDarkMode} className="space-y-10 p-12 border-t-[12px] shadow-2xl rounded-[2.5rem]" style={{borderTopColor: themeColor}}>
                        <div className="text-center"><h2 className="text-4xl font-black dark:text-white mb-3 tracking-tighter">עיצוב המערכת</h2><p className="text-slate-500 font-bold uppercase text-xs tracking-widest opacity-60">Visual Identity Control</p></div>
                        <div className="flex flex-col items-center bg-black/5 dark:bg-slate-900/50 p-12 rounded-[2rem] border-4 border-dashed border-slate-200 transition-all"><div className="relative group mb-10 transform transition-transform hover:scale-110"><input type="color" className="w-32 h-32 rounded-full cursor-pointer border-none bg-transparent" value={themeColor} onChange={e => { setThemeColor(e.target.value); callApi({action:'UPDATE_SETTINGS', updates:{themeColor:e.target.value}}); }} /><div className="absolute inset-0 rounded-full pointer-events-none border-[12px] border-white dark:border-slate-800 shadow-2xl scale-110"></div></div><p className="font-mono text-3xl dark:text-white font-black uppercase tracking-[0.3em] mb-3">{themeColor}</p><span className="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em] bg-white dark:bg-slate-800 px-4 py-1.5 rounded-full border dark:border-slate-700">Primary Color</span></div>
                    </Card>
                </div>
            );

            return null;
        }

        function CustomerView({ tab, dbData, callApi, themeColor, user, isSaving, setActiveTab, isDarkMode }) {
            const services = useMemo(() => (dbData || []).filter(i => i.type === 'service'), [dbData]);
            const appointments = useMemo(() => (dbData || []).filter(i => i.type === 'appointment' && String(i.customerId) === String(user.id)), [dbData, user.id]);
            const [booking, setBooking] = useState(null);
            const [cancelTarget, setCancelTarget] = useState(null);
            const getTodayStr = () => new Date().toISOString().split('T')[0];

            if (tab === 'main') return (
                <div className="space-y-10 animate-in fade-in duration-500 text-right">
                    <div><h2 className="text-4xl font-black dark:text-white tracking-tighter leading-none">הזמנת שירות חדש</h2><p className="text-slate-500 mt-3 font-black uppercase text-xs tracking-widest opacity-60">Select a service to begin booking</p></div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {services.map((s, idx) => (
                            <Card key={s.id || idx} themeColor={themeColor} isDarkMode={isDarkMode} className="group hover:ring-4 hover:shadow-2xl transition-all cursor-pointer overflow-hidden p-0 border-none relative rounded-[2rem]" style={{'--tw-ring-color': themeColor + '44'}} onClick={()=>setBooking({svc:s, date:getTodayStr(), time:'', message:''})}>
                                <div className="h-60 bg-black/5 dark:bg-slate-900 flex items-center justify-center text-slate-300 relative shadow-inner"><div className="absolute top-6 right-6 bg-white/95 dark:bg-slate-800/95 px-5 py-2 rounded-2xl text-[11px] font-black uppercase tracking-widest shadow-2xl border" style={{color: themeColor}}>Available Now</div>{s.img ? <img src={s.img} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000"/> : <Icon name="image" size={60} className="opacity-20"/>}</div>
                                <div className="p-8 text-right"><h3 className="font-black text-2xl dark:text-white mb-3 tracking-tight group-hover:translate-x-2 transition-transform">{s.name}</h3><div className="flex justify-between items-center text-xs text-slate-400 font-black uppercase tracking-widest pt-6 border-t dark:border-slate-700"><span className="flex items-center gap-2 bg-black/5 dark:bg-slate-900 p-2.5 rounded-xl border"><Icon name="clock" size={16}/> {normalizeTime(s.open)} - {normalizeTime(s.close)}</span><span className="bg-black/5 dark:bg-slate-900 p-2.5 rounded-xl border">{formatDuration(s.interval)}</span></div></div>
                            </Card>
                        ))}
                    </div>
                    {booking && (
                        <div className="fixed inset-0 bg-slate-900/20 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
                            <Card themeColor={themeColor} isDarkMode={isDarkMode} className="max-w-lg w-full space-y-8 animate-in slide-in-from-bottom-12 duration-500 shadow-[0_0_80px_rgba(0,0,0,0.15)] rounded-[2.5rem] overflow-hidden p-0 border-none text-right" style={{backgroundColor: isDarkMode ? '' : blendWithWhite(themeColor, 0.15) }}>
                                <div className="p-8 bg-black/5 dark:bg-slate-700 flex justify-between items-center border-b dark:border-slate-600 shadow-sm"><div className="flex flex-col"><h3 className="font-black text-3xl dark:text-white tracking-tighter leading-tight">קביעת {booking.svc.name}</h3><p className="text-[10px] font-black uppercase text-slate-400 mt-2 tracking-widest">Appointment Scheduler</p></div><button onClick={()=>setBooking(null)} className="p-3 hover:bg-white/50 dark:hover:bg-slate-600 rounded-2xl transition-colors bg-white/20 shadow-sm border dark:border-slate-600"><Icon name="x" size={24}/></button></div>
                                <div className="p-8 space-y-6 pt-2 text-right"><div className="p-4 bg-amber-50 dark:bg-amber-900/20 border border-amber-100 rounded-2xl flex items-start gap-3"><Icon name="alert" size={20} className="text-amber-600 mt-0.5"/><p className="text-sm text-amber-800 dark:text-amber-200 font-bold leading-relaxed">שימו לב: לאחר שליחת ההזמנה, עליכם להמתין לאישור סופי מהמוכר.</p></div><div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">1. בחר תאריך</label><input type="date" className="w-full border-2 rounded-2xl p-4 bg-white/70 outline-none" min={getTodayStr()} value={booking.date} onChange={e=>setBooking({...booking, date:e.target.value})}/></div><div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">2. בחר שעה זמינה</label><div className="grid grid-cols-3 gap-3 max-h-[200px] overflow-y-auto pr-2 custom-scroll">{generateTimeSlots(booking.svc.open, booking.svc.close, booking.svc.interval).map(slot => { const isTaken = dbData.some(a => a && a.type === 'appointment' && a.date === booking.date && normalizeTime(a.time) === slot); const isSelected = booking.time === slot; return (<button key={slot} disabled={isTaken} onClick={() => setBooking({...booking, time: slot})} className={`p-3 rounded-xl border-2 font-bold transition-all text-sm ${isTaken ? "bg-black/10 text-slate-300 border-transparent cursor-not-allowed" : isSelected ? "border-blue-600 bg-white text-blue-700 shadow-md scale-105" : "border-white/40 dark:border-slate-700 dark:text-white hover:border-white"}`} style={isSelected ? {borderColor: themeColor, color: themeColor } : {}}>{slot}</button>); })}</div></div><div className="space-y-2"><label className="text-[10px] font-black text-slate-400 uppercase block tracking-widest">3. הודעה למוכר (אופציונלי)</label><textarea className="w-full border-2 rounded-2xl p-4 bg-white/70 outline-none min-h-[100px]" placeholder="ספר לנו על בקשות מיוחדות או שאלות..." onChange={e=>setBooking({...booking, message:e.target.value})}/></div><div className="flex gap-4 pt-4"><Button variant="secondary" className="flex-1 py-5 text-xl" onClick={()=>setBooking(null)}>ביטול</Button><Button themeColor={themeColor} disabled={isSaving || !booking.time} className="flex-1 py-5 font-black shadow-2xl text-xl" onClick={()=>{ callApi({action:'ADD_ROW', data:{id:String(Date.now()), type:'appointment', serviceId:booking.svc.id, serviceName:booking.svc.name, customerId:user.id, customerName:user.name, date:booking.date, time:booking.time, message:booking.message, status: 'pending'}}); setBooking(null); }}>אשר הזמנה עכשיו</Button></div></div>
                            </Card>
                        </div>
                    )}
                </div>
            );

            if (tab === 'my-bookings') return (
                <div className="space-y-10 animate-in fade-in duration-500 text-right">
                    <h2 className="text-3xl font-black dark:text-white tracking-tighter">התורים שלי</h2>
                    <div className="grid gap-6">
                        {appointments.length === 0 && (<div className="text-center py-28 bg-white/30 dark:bg-slate-800 rounded-[3rem] border-4 border-dashed border-slate-100 dark:border-slate-700 opacity-60"><Icon name="calendar" size={60} className="mx-auto text-slate-200 mb-6"/><p className="text-slate-400 italic font-black uppercase tracking-[0.2em] text-sm">No Appointments Found</p><button onClick={()=>setActiveTab('main')} className="mt-8 text-blue-500 font-black underline uppercase text-sm">Book Your First Session</button></div>)}
                        {appointments.map((a, idx) => {
                            if (!a) return null;
                            const isPendingCancel = a.status === 'cancel_requested';
                            const isConfirmed = a.status === 'confirmed';
                            return (
                                <Card key={a.id || idx} themeColor={themeColor} isDarkMode={isDarkMode} className="flex flex-col sm:flex-row justify-between items-center p-8 border-slate-100 dark:border-slate-700 hover:scale-[1.01] transition-transform rounded-[2rem] relative overflow-hidden shadow-sm">
                                    <div className="absolute top-0 left-0 w-2 h-full opacity-30" style={{backgroundColor: isPendingCancel ? '#ef4444' : isConfirmed ? themeColor : '#f59e0b'}}></div>
                                    <div className="flex items-center gap-8">
                                        <div className="w-16 h-16 rounded-2xl flex items-center justify-center text-white shadow-xl shrink-0 transition-transform hover:rotate-6" style={{backgroundColor: isPendingCancel ? '#ef4444' : isConfirmed ? themeColor : '#f59e0b'}}><Icon name={isPendingCancel ? "alert" : isConfirmed ? "check" : "clock"} size={32}/></div>
                                        <div className="text-right text-right"><h4 className="font-black text-3xl dark:text-white leading-none tracking-tighter mb-2">{a.serviceName}</h4><div className="flex items-center gap-4 mt-2"><p className="text-sm text-slate-400 font-black uppercase tracking-widest">{normalizeDate(a.date)}</p><span className="w-1.5 h-1.5 rounded-full bg-slate-200/50"></span><p className="text-sm font-black uppercase tracking-widest" style={{color: themeColor}}>{normalizeTime(a.time)}</p></div></div>
                                    </div>
                                    <div className="flex items-center gap-4 mt-6 sm:mt-0">
                                        <span className={`text-[11px] px-6 py-2.5 rounded-2xl font-black uppercase tracking-[0.2em] border shadow-sm ${isPendingCancel ? 'bg-red-50 text-red-700 border-red-200' : isConfirmed ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-amber-100 text-amber-700 border-amber-200'}`}>{isPendingCancel ? 'Waiting for Cancel Approval' : isConfirmed ? 'Confirmed' : 'Pending Confirmation'}</span>
                                        {!isPendingCancel && <button disabled={isSaving} onClick={() => setCancelTarget(a)} className="p-2 text-red-500 hover:bg-red-50 rounded-xl transition-colors bg-white/40 shadow-sm" title="בטל תור"><Icon name="trash" size={20}/></button>}
                                    </div>
                                </Card>
                            );
                        })}
                    </div>
                    {cancelTarget && (
                        <div className="fixed inset-0 bg-slate-900/30 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
                            <Card themeColor={themeColor} isDarkMode={isDarkMode} className="max-w-md w-full space-y-6 animate-in zoom-in duration-300 shadow-2xl rounded-[2rem] overflow-hidden p-8 border-none text-center" style={{backgroundColor: isDarkMode ? '' : blendWithWhite(themeColor, 0.15) }}>
                                <div className="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><Icon name="alert" size={40}/></div>
                                <h3 className="text-2xl font-black dark:text-white tracking-tighter">האם לבטל את התור?</h3>
                                <div className="p-4 bg-white/40 border border-red-200 rounded-2xl"><p className="text-red-700 font-bold leading-relaxed">שימו לב: ביטול תור בטווח של פחות מ-24 שעות ממועד התור המאושר כרוך בתשלום דמי ביטול. <br/>הבקשה תישלח לאישור המוכר.</p></div>
                                <div className="flex flex-col gap-3 pt-4">
                                    <Button variant="danger" className="w-full py-4 text-lg font-black" disabled={isSaving} onClick={() => { callApi({action:'UPDATE_ROW', id: cancelTarget.id, updates: {status: 'cancel_requested'}}); setCancelTarget(null); }}>שלח בקשת ביטול</Button>
                                    <Button variant="secondary" className="w-full py-4 text-lg" onClick={()=>setCancelTarget(null)}>חזור אחורה</Button>
                                </div>
                            </Card>
                        </div>
                    )}
                </div>
            );

            return null;
        }

        // --- Main App Component ---

        function App() {
            const [user, setUser] = useState(null);
            const [dbData, setDbData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [refreshing, setRefreshing] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [themeColor, setThemeColor] = useState('#2563eb');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [activeTab, setActiveTab] = useState('main');
            const [status, setStatus] = useState('טוען...');

            const fetchData = useCallback(async (isBackground = false) => {
                if (!isBackground) setLoading(true);
                setRefreshing(true);
                try {
                    const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
                    if (!res.ok) throw new Error(`Server returned status ${res.status}`);
                    const text = await res.text();
                    let data;
                    try { data = JSON.parse(text); } catch (e) { throw new Error("Invalid response format"); }
                    if (Array.isArray(data)) {
                        setDbData(data);
                        setStatus('מחובר');
                        const settings = data.find(i => i && i.type === 'settings');
                        if (settings?.themeColor) setThemeColor(settings.themeColor);
                    }
                } catch (e) { 
                    console.error("Fetch failed:", e);
                    setStatus('שגיאת חיבור');
                } finally { 
                    setLoading(false); 
                    setRefreshing(false); 
                }
            }, []);

            useEffect(() => {
                fetchData();
                const interval = setInterval(() => fetchData(true), 5000); 
                return () => clearInterval(interval);
            }, [fetchData]);

            useEffect(() => {
                if (!isDarkMode) {
                    document.body.style.backgroundColor = blendWithWhite(themeColor, 0.04);
                } else {
                    document.body.style.backgroundColor = '#0f172a';
                }
            }, [themeColor, isDarkMode]);

            const callApi = async (payload) => {
                setIsSaving(true);
                const previousData = [...dbData];
                setDbData(prev => {
                    if (payload.action === 'ADD_ROW') return [...prev, payload.data];
                    if (payload.action === 'UPDATE_ROW') return prev.map(item => item && String(item.id) === String(payload.id) ? {...item, ...payload.updates} : item);
                    if (payload.action === 'DELETE_ROW') return prev.filter(item => item && String(item.id) !== String(payload.id));
                    if (payload.action === 'UPDATE_SETTINGS') {
                         if (payload.updates.themeColor) setThemeColor(payload.updates.themeColor);
                         return prev.map(item => item && item.type === 'settings' ? {...item, ...payload.updates} : item);
                    }
                    return prev;
                });
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                    setTimeout(() => fetchData(true), 3000);
                } catch (e) {
                    setDbData(previousData); 
                } finally {
                    setIsSaving(false);
                }
            };

            const handleLogin = (email, password) => {
                const normalizedEmail = email.toLowerCase().trim();
                const found = dbData.find(u => u && u.type === 'user' && u.email?.toLowerCase().trim() === normalizedEmail && String(u.password) === String(password));
                if (found) {
                    setUser(found);
                    setActiveTab('main');
                    return true;
                }
                return false;
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center dark:bg-slate-900 dark:text-white gap-4 text-center p-6">
                    <div className="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <p className="font-bold text-xl animate-pulse">מתחבר למערכת...</p>
                </div>
            );

            if (!user) return <LoginScreen onLogin={handleLogin} themeColor={themeColor} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} status={status} refreshing={refreshing} callApi={callApi} />;

            return (
                <div className={`min-h-screen flex flex-col dark:bg-slate-900 ${isDarkMode ? 'dark text-white' : ''}`} dir="rtl">
                    <header className="border-b p-4 flex justify-between items-center sticky top-0 z-50 shadow-sm transition-colors" style={{backgroundColor: isDarkMode ? '#1e293b' : blendWithWhite(themeColor, 0.08)}}>
                        <div className="flex items-center gap-4">
                            <div className="p-2.5 rounded-2xl text-white flex items-center justify-center shadow-lg transform transition-transform hover:scale-105" style={{backgroundColor: themeColor}}>
                                <Icon name={refreshing ? "refresh" : "calendar"} size={24} className={refreshing ? "animate-spin" : ""}/>
                            </div>
                            <div className="hidden sm:block">
                                <h1 className="font-bold text-slate-800 dark:text-white leading-none text-xl tracking-tight">Market Manager</h1>
                                <p className="text-[10px] text-slate-500 uppercase mt-1.5 font-black tracking-widest">Active Cloud Sync</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-6 text-right">
                            <div className="border-l pl-4 border-slate-200 dark:border-slate-700">
                                <p className="text-sm font-bold dark:text-white leading-none mb-1">{user.name}</p>
                                <p className="text-[10px] font-black uppercase px-2 py-0.5 rounded-full bg-white/50 dark:bg-slate-700 inline-block" style={{color: themeColor}}>{user.role}</p>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-yellow-400 transition-colors rounded-xl bg-white/50 dark:bg-slate-700">
                                    <Icon name={isDarkMode ? "sun" : "moon"}/>
                                </button>
                                <button onClick={() => setUser(null)} className="p-2.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-xl transition-colors bg-white/50 dark:bg-slate-700">
                                    <Icon name="logout"/>
                                </button>
                            </div>
                        </div>
                    </header>

                    <nav className="border-b flex gap-2 px-6 overflow-x-auto no-scrollbar shadow-sm sticky top-[73px] z-40" style={{backgroundColor: isDarkMode ? '#1e293b' : blendWithWhite(themeColor, 0.06)}}>
                        {user.role === 'seller' ? (
                            <Fragment>
                                <NavTab active={activeTab==='main'} label="לוח הזמנות" icon="calendar" onClick={()=>setActiveTab('main')} themeColor={themeColor} isDarkMode={isDarkMode}/>
                                <NavTab active={activeTab==='customers'} label="ניהול לקוחות" icon="users" onClick={()=>setActiveTab('customers')} themeColor={themeColor} isDarkMode={isDarkMode}/>
                                <NavTab active={activeTab==='services'} label="ניהול שירותים" icon="image" onClick={()=>setActiveTab('services')} themeColor={themeColor} isDarkMode={isDarkMode}/>
                                <NavTab active={activeTab==='settings'} label="הגדרות מיתוג" icon="settings" onClick={()=>setActiveTab('settings')} themeColor={themeColor} isDarkMode={isDarkMode}/>
                            </Fragment>
                        ) : (
                            <Fragment>
                                <NavTab active={activeTab==='main'} label="הזמנת שירות" icon="plus" onClick={()=>setActiveTab('main')} themeColor={themeColor} isDarkMode={isDarkMode}/>
                                <NavTab active={activeTab==='my-bookings'} label="התורים שלי" icon="calendar" onClick={()=>setActiveTab('my-bookings')} themeColor={themeColor} isDarkMode={isDarkMode}/>
                            </Fragment>
                        )}
                    </nav>

                    <main className="flex-1 p-6 max-w-7xl mx-auto w-full text-right">
                        {user.role === 'seller' ? (
                            <SellerView tab={activeTab} dbData={dbData} callApi={callApi} themeColor={themeColor} setThemeColor={setThemeColor} isSaving={isSaving} setActiveTab={setActiveTab} isDarkMode={isDarkMode} />
                        ) : (
                            <CustomerView tab={activeTab} dbData={dbData} callApi={callApi} themeColor={themeColor} user={user} isSaving={isSaving} setActiveTab={setActiveTab} isDarkMode={isDarkMode} />
                        )}
                    </main>
                    
                    {/* RESTORED DUPLICATE BOOKING WARNING LOGIC */}
                    {user.role === 'seller' && activeTab === 'main' && (
                        <div className="fixed bottom-6 left-6 z-[100]">
                            {(() => {
                                const appointments = (dbData || []).filter(i => i.type === 'appointment');
                                const conflictsCount = appointments.filter(a => 
                                    appointments.some(other => 
                                        other && a && String(other.id) !== String(a.id) && 
                                        other.date === a.date && 
                                        normalizeTime(other.time) === normalizeTime(a.time)
                                    )
                                ).length / 2;
                                
                                if (conflictsCount > 0) {
                                    return (
                                        <div className="bg-red-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce">
                                            <Icon name="alert" size={24}/>
                                            <span className="font-bold">שים לב: נמצאו {Math.ceil(conflictsCount)} התנגשויות ביומן!</span>
                                        </div>
                                    );
                                }
                                return null;
                            })()}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
